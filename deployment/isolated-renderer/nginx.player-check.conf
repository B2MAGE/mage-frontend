# Retired legacy static-host alternative. Do not serve verification artifacts.
server {
  listen 80;
  server_name _;
  add_header Content-Security-Policy "default-src 'none'; sandbox; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Cache-Control "no-store" always;
  location = /player-check { return 410; }
  location ^~ /player-check/ { return 410; }
  location = /healthz { return 200 'ok'; }
  location / { return 404; }
}
