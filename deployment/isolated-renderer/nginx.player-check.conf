# This container serves only the parent verification page, never scene code.
# The proxy must preserve /player-check/ and route only that prefix here.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location = /player-check { return 308 /player-check/; }
  location /player-check/ {
    try_files $uri $uri/ =404;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; frame-src https://d2wwpgc7sgvmnm.cloudfront.net; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
  }
  location / { return 404; }
}
