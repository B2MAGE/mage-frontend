<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Builder catalog local review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d11;color:#e9e8f2;font:14px/1.5 system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:20px}h1{margin:0;font-size:24px}h2{font-size:17px;margin:0}p{color:#b7b4c3;margin:8px 0 16px}.toolbar{display:flex;align-items:end;gap:12px;flex-wrap:wrap;padding:16px;background:#15171f;border:1px solid #353441;border-radius:10px;margin:16px 0}label{display:flex;flex-direction:column;gap:5px}label.check{flex-direction:row;align-items:center;align-self:center}select,button,input{font:inherit;color:inherit}select,button,input[type=number]{background:#20222c;border:1px solid #4f4b60;border-radius:6px;padding:8px 12px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button.primary{background:#6854b7}input[type=checkbox]{accent-color:#9a83f5}.players{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr))}.card{min-width:0;background:#111319;border:1px solid #353441;border-radius:10px;overflow:hidden}.card header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px}.stage-wrap{display:flex;justify-content:center;background:#050508;border-block:1px solid #353441}.stage{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden}.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.status{color:#8edeb4;font-size:12px}.error{color:#ffb0b0}.metrics{padding:12px 16px;display:grid;gap:6px}.metrics code{font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap;word-break:break-word}.captured{display:block;width:100%;border-block:1px solid #353441}.capture-label{display:flex;justify-content:space-between;padding:10px 16px}.capture-label a{color:#c6b9ff}details{padding:10px 16px;border-top:1px solid #353441}summary{cursor:pointer}pre{font-size:11px;white-space:pre-wrap;word-break:break-word;color:#c3bfd4}.note{padding:12px 16px;border:1px solid #5b502f;background:#201d13;border-radius:8px;color:#d7c792}.foot{font-size:12px;color:#aaa5b7}#boot-error{white-space:pre-wrap;color:#ffb0b0}@media(max-width:600px){main{padding:10px}.toolbar{gap:8px;padding:10px}select{max-width:100%}.players{grid-template-columns:1fr}}
</style></head><body><div id="root"></div><pre id="boot-error"></pre><script type="module" src="/scripts/builder-catalog-check.tsx"></script></body></html>
