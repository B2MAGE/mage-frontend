<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>MAGE saved and temporary audio settings check</title>
<style>body{font:16px system-ui;background:#101522;color:#ecf1ff;padding:32px;max-width:1000px;margin:auto}button{padding:12px 18px;font:inherit}pre{white-space:pre-wrap;line-height:1.7;padding:20px;background:#1c2539;border-radius:12px}#scene{width:256px;height:256px}</style>
<h1>MAGE saved and temporary audio settings check</h1>
<p>Exercises the platform adapter and isolated engine with a silent test track. Local custom playback must be allowed by the development backend.</p>
<button id="run">Run player check</button>
<pre id="results">Ready.</pre>
<div id="scene" aria-label="Test scene"></div>
<script type="module">
import { createMagePlayer } from '/src/modules/player/infrastructure/engineAdapter.ts'
const button = document.querySelector('#run'), result = document.querySelector('#results')
const wait = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds))
const assert = (condition, message) => { if (!condition) throw new Error(message) }
const pass = message => { result.textContent += `PASS · ${message}\n` }
const settings = amount => ({ version: 1, sensitivity: 1, mappings: [{ target: 'size', source: 'bass-hit', amount, attack: 0.02, release: 0.2 }] })
function silentTrack() {
  const rate = 48000, samples = rate * 8, bytes = new ArrayBuffer(44 + samples * 2), view = new DataView(bytes)
  const text = (offset, value) => [...value].forEach((letter, i) => view.setUint8(offset + i, letter.charCodeAt(0)))
  text(0, 'RIFF'); view.setUint32(4, 36 + samples * 2, true); text(8, 'WAVE'); text(12, 'fmt ')
  view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true)
  view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true)
  text(36, 'data'); view.setUint32(40, samples * 2, true)
  return URL.createObjectURL(new Blob([bytes], { type: 'audio/wav' }))
}
button.addEventListener('click', async () => {
  button.disabled = true; result.textContent = ''
  let player, track
  try {
    const scene = { audioResponse: 'mapped-v1', audioResponseConfig: settings(1), visualizer: { shader: 'let size = input(); color(0.2,0.7,1); sphere(0.4 + size * 0.1);' } }
    player = await createMagePlayer(document.querySelector('#scene'), { pixelRatio: 1, initialSceneBlob: scene })
    await player.loadSceneBlob(scene)
    track = silentTrack()
    await player.loadAudio({ sourcePath: track, sourceLabel: 'Silent verification track' })
    await wait(200)
    assert(player.getAudioState().isLoaded, 'Audio did not load through the parent adapter')
    const before = player.getAudioState()
    player.setAudioResponseSettings('mapped-v1', settings(2))
    await wait(180)
    const after = player.getAudioState()
    assert(after.currentTime > before.currentTime + 0.1 && after.sourcePath === before.sourcePath && after.isLoaded && player.getPlaybackState() === 'playing', 'Editing saved settings interrupted playback')
    pass('saved settings update while the same song continues')
    player.setAudioResponseOverride(settings(3))
    assert(player.getAudioResponseState().savedConfig.mappings[0].amount === 2 && player.getAudioResponseState().effectiveConfig.mappings[0].amount === 3, 'Temporary override replaced saved defaults')
    player.setAudioResponseSettings('mapped-v1', settings(1.5))
    assert(player.getAudioResponseState().effectiveConfig.mappings[0].amount === 3, 'Saved edit erased viewer override')
    player.setAudioResponseOverride(null)
    assert(player.getAudioResponseState().effectiveConfig.mappings[0].amount === 1.5, 'Reset did not restore latest saved defaults')
    pass('temporary overrides stay separate and reset to current creator defaults')
    const capabilities = player.getAudioResponseCapabilities()
    assert(capabilities.supportedTargets.includes('size') && capabilities.unsupportedTargets.length === 0, 'Shader capabilities were lost at adapter boundary')
    pass('compiled shader capabilities cross the bounded bridge')
    player.setPlaybackState('paused')
    const pausedTime = player.getAudioState().currentTime
    player.setAudioResponseSettings('mapped-v1', settings(0.5))
    await wait(150)
    assert(player.getPlaybackState() === 'paused' && Math.abs(player.getAudioState().currentTime - pausedTime) < 0.03, 'Updating settings resumed paused audio')
    pass('settings changes preserve paused playback')
    player.setAudioResponseOverride(settings(3))
    await player.loadSceneBlob({ visualizer: scene.visualizer })
    assert(player.getAudioResponseState().override === null && player.getAudioResponseState().effectiveMode === 'legacy', 'Scene change leaked prior override or mode')
    pass('switching to an older scene clears temporary settings and restores legacy behavior')
    result.textContent += '\nAll platform player checks passed.'
  } catch (error) {
    result.textContent += `FAIL · ${error.stack || error}`
  } finally {
    player?.dispose()
    if (track) URL.revokeObjectURL(track)
    button.disabled = false
  }
})
</script>
</html>
