server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Keep nested browsing contexts on the reviewed renderer entry point.
  # This complements the child's sandbox/CSP, including attempted self-navigation.
  add_header Content-Security-Policy "frame-src https://d2wwpgc7sgvmnm.cloudfront.net/index.html; object-src 'none'; base-uri 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
