server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Keep nested browsing contexts on the reviewed renderer entry point.
  # This complements the child's sandbox/CSP, including attempted self-navigation.
  add_header Content-Security-Policy "frame-src https://d2wwpgc7sgvmnm.cloudfront.net/index.html; object-src 'none'; base-uri 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Keep retired verification URLs from falling back to the application shell.
  location = /player-check { return 410; }
  location ^~ /player-check/ { return 410; }
  location = /__isolated-security { return 410; }
  location ^~ /__isolated-security/ { return 410; }
  location = /scripts { return 410; }
  location ^~ /scripts/ { return 410; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
